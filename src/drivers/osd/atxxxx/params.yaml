module_name: atxxxx
parameters:
- group: OSD
  definitions:
    OSD_ATXXXX_CFG:
      description:
        short: Enable/Disable the ATXXX OSD Chip
        long: |-
          Configure the ATXXXX OSD Chip (mounted on the OmnibusF4SD board) and
          select the transmission standard.
      type: enum
      values:
        0: Disabled
        1: NTSC
        2: PAL
      default: 0
      reboot_required: true
    OSD_MVLQ_EN:
      description:
        short: Show Multiversity link statistics
        long: |-
          Show the per-radio link statistics a Multiversity CRSF combiner
          publishes on RC channels 11-16 (as PWM = value + 1000): one row each
          for the 400, 800 and 2.4 radios with RSSI and SNR.
      type: boolean
      default: 0
    OSD_MVLQ_X:
      description:
        short: Multiversity link statistics column
      type: int32
      min: 0
      max: 19
      default: 1
    OSD_MVLQ_Y:
      description:
        short: Multiversity link statistics row
        long: First of the three rows.
      type: int32
      min: 0
      max: 13
      default: 6
